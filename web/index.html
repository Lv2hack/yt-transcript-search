<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube transcript search</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Ccircle cx='28' cy='28' r='14' fill='none' stroke='%23ffb547' stroke-width='6'/%3E%3Cpath d='M38 38l14 14' stroke='%23ffb547' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="./">YouTube <span>search</span></a>
  </header>

  <main>
    <h1 class="page-title">YouTube search</h1>
    <p class="page-intro">Search what was said in the channels below. Click a time to open the video at that moment.</p>

    <form class="panel" id="search-form" autocomplete="off">
      <div class="search-row">
        <input class="field" id="q" type="search" placeholder="Search transcripts" aria-label="Search transcripts">
        <button class="btn btn-primary" type="submit">Search</button>
      </div>
      <div class="filters">
        <span class="seg" role="group" aria-label="Match">
          <button type="button" data-mode="words" aria-pressed="true" title="Every word in the same passage (about 15 seconds), any order">All words</button>
          <button type="button" data-mode="phrase" aria-pressed="false" title="These words together, in this order">Exact phrase</button>
        </span>
        <label>Channel
          <select class="yt-select" id="f-channel"><option value="">All channels</option></select>
        </label>
        <label>Published
          <select class="yt-select" id="f-days">
            <option value="">Any time</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 3 months</option>
          </select>
        </label>
        <label>Sort
          <select class="yt-select" id="f-sort">
            <option value="new">Newest first</option>
            <option value="hits">Most matches</option>
          </select>
        </label>
      </div>
    </form>

    <div class="results-head" id="results-head" hidden></div>
    <div class="results" id="results"></div>

    <section class="section" aria-labelledby="channels-title">
      <div class="section-head">
        <h2 class="section-title" id="channels-title">Channels</h2>
        <span class="nightly" id="nightly"></span>
      </div>

      <div class="channels" id="channels"></div>
      <p class="storage" id="storage"></p>

      <form class="panel add" id="add-form" autocomplete="off">
        <h3>Add a channel or fetch further back</h3>
        <div class="add-row">
          <input class="field" id="add-url" placeholder="@handle or channel URL" aria-label="Channel" list="known-channels">
          <datalist id="known-channels"></datalist>
          <label class="add-back">Last
            <input class="field" id="add-n" type="number" min="1" max="120" step="1" value="1" inputmode="numeric" aria-label="How far back">
            <select class="yt-select" id="add-unit" aria-label="Days, weeks or months">
              <option value="days">days</option>
              <option value="weeks">weeks</option>
              <option value="months" selected>months</option>
            </select>
          </label>
          <button class="btn btn-primary" type="submit">Fetch transcripts</button>
        </div>
        <p class="add-note" id="add-note"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer"><a href="https://github.com/Lv2hack/yt-transcript-search">yt-transcript-search</a> · transcripts by <a href="https://github.com/yt-dlp/yt-dlp">yt-dlp</a></footer>

  <script>
    // Transcripts come from the yt-search container (yt/ytsearch.py), under /api/yt/.
    const API = "/api/yt";
    const CHANNEL_PAGE = "channel.html", TRANSCRIPT_PAGE = "transcript.html";
    const ADD_NOTE = "Videos and livestreams only (no Shorts). Videos already downloaded are skipped.";

    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const parseDay = (iso) => new Date(iso + "T12:00:00");
    const dayDiff = (a, b) => Math.round((parseDay(a) - parseDay(b)) / 86400000);
    const fmtDate = (iso) => {
      if (!iso) return "?";
      const d = parseDay(iso);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
    };
    const fmtWhen = (isoTime) => {
      if (!isoTime) return "never";
      const d = new Date(isoTime), today = new Date();
      const time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
      if (d.toDateString() === today.toDateString()) return `today ${time}`;
      if (d.toDateString() === new Date(today - 86400000).toDateString()) return `yesterday ${time}`;
      return `${fmtDate(isoTime.slice(0, 10))} ${time}`;
    };
    const fmtTime = (s) => {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, "0");
      return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
    };
    // Links start a few seconds early so the sentence isn't cut off.
    const ytLink = (id, s) => `https://youtu.be/${id}?t=${Math.max(0, s - 3)}`;
    const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
    const fmtBytes = (b) => {
      const units = ["bytes", "KB", "MB", "GB", "TB"];
      let i = 0;
      while (b >= 1000 && i < units.length - 1) { b /= 1000; i++; }
      return `${i ? b.toFixed(b < 10 ? 1 : 0) : b} ${units[i]}`;
    };

    async function api(path, options) {
      const r = await fetch(API + path, options);
      const data = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` }));
      if (!r.ok) throw new Error(data.error || r.statusText);
      return data;
    }

    // ----- search -----
    let mode = "words", searchSeq = 0;

    async function search() {
      const q = $("#q").value.trim();
      const head = $("#results-head"), out = $("#results");
      const params = new URLSearchParams({ q, mode, channel: $("#f-channel").value, days: $("#f-days").value, sort: $("#f-sort").value });
      history.replaceState(null, "", q ? "?" + params : location.pathname);
      if (!q) { head.hidden = true; out.innerHTML = ""; return; }

      const seq = ++searchSeq;
      let data;
      try {
        data = await api("/search?" + params);
      } catch (e) {
        if (seq !== searchSeq) return;
        head.hidden = true;
        out.innerHTML = `<div class="panel empty">${esc(e.message)}</div>`;
        return;
      }
      if (seq !== searchSeq) return;   // a newer search finished first

      head.hidden = false;
      head.innerHTML = `<span><strong>${data.total_hits}${data.capped ? "+" : ""}</strong> match${data.total_hits === 1 ? "" : "es"} in <strong>${data.total_videos}</strong> video${data.total_videos === 1 ? "" : "s"}${data.total_videos > data.results.length ? ` (showing ${data.results.length})` : ""}</span><span>Searched ${plural(data.searched, "transcript")} · upper/lower case ignored</span>`;

      if (!data.results.length) {
        out.innerHTML = `<div class="panel empty">No matches for “${esc(q)}”. Try fewer words${mode === "phrase" ? ", or <em>All words</em> instead of <em>Exact phrase</em>" : ""}.</div>`;
        return;
      }

      out.innerHTML = data.results.map((v) => {
        const items = v.hits.map((h, i) => `
          <li class="hit"${i >= 3 ? " hidden" : ""}>
            <a class="ts" href="${ytLink(v.id, h.t)}" target="_blank" rel="noopener">${fmtTime(h.t)}</a>
            <span class="hit-text">${h.html}</span>
          </li>`).join("");
        return `
          <article class="panel result">
            <h3 class="result-title"><a href="https://youtu.be/${esc(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a></h3>
            <div class="result-meta">
              <span>${esc(v.channel)}</span><span>${fmtDate(v.date)}</span>
              ${v.live ? '<span class="tag tag-live">Livestream</span>' : ""}
              <span class="tag" title="${v.captions === "auto" ? "YouTube's speech-to-text: no punctuation, the odd misheard word" : "Captions uploaded by the creator"}">${v.captions === "auto" ? "Auto captions" : "Creator captions"}</span>
              <span class="result-actions"><a href="${TRANSCRIPT_PAGE}?v=${encodeURIComponent(v.id)}&amp;t=${v.hits[0].t}&amp;q=${encodeURIComponent(q)}">Full transcript →</a></span>
            </div>
            <ul class="hits">${items}</ul>
            ${v.hits.length > 3 ? `<button class="more-hits" type="button">Show ${v.hits.length - 3} more</button>` : ""}
          </article>`;
      }).join("");
    }

    $("#search-form").addEventListener("submit", (e) => { e.preventDefault(); search(); });
    ["#f-channel", "#f-days", "#f-sort"].forEach((s) => $(s).addEventListener("change", search));
    document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
      mode = b.dataset.mode;
      document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      search();
    }));
    $("#results").addEventListener("click", (e) => {
      if (!e.target.matches(".more-hits")) return;
      e.target.previousElementSibling.querySelectorAll("[hidden]").forEach((li) => (li.hidden = false));
      e.target.remove();
    });

    // ----- channels -----
    let state = null, pollTimer = null;

    function renderChannels() {
      const { channels, job, queued, today } = state;
      // Coverage bars share one scale: the last 6 months, or further if a channel goes back further.
      const oldest = channels.reduce((m, c) => (c.covered_from && c.covered_from < m ? c.covered_from : m), today);
      const span = Math.max(180, dayDiff(today, oldest));

      const box = $("#channels");
      if (!channels.length && !(job && !job.channel)) {
        box.innerHTML = `<div class="panel empty">No channels yet. Add one below.</div>`;
      } else {
        box.innerHTML = channels.map((c) => {
          const running = job && job.channel === c.id;
          const waiting = queued.some((q) => q.channel === c.id);
          const covered = c.covered_from && c.covered_to;
          const left = covered ? ((span - dayDiff(today, c.covered_from)) / span) * 100 : 0;
          const width = covered ? (dayDiff(c.covered_to, c.covered_from) / span) * 100 : 0;
          const status = [
            c.pending ? `<span class="tag tag-warn" title="Captions not ready yet (usually a recent livestream); retried each night">${c.pending} waiting for captions</span>` : "",
            c.none ? `<span class="tag" title="YouTube has no captions for these, or they couldn't be read">${c.none} without captions</span>` : "",
            c.last_error && !running ? `<span class="tag tag-error" title="${esc(c.last_error)}">Last fetch failed</span>` : "",
          ].join("");
          const link = c.handle ? `https://www.youtube.com/${c.handle}` : `https://www.youtube.com/channel/${c.id}`;
          return `
            <div class="panel channel" data-id="${esc(c.id)}">
              <div>
                <div class="channel-name"><a href="${CHANNEL_PAGE}?id=${encodeURIComponent(c.id)}" title="Videos and transcripts">${esc(c.name)}</a></div>
                <div class="channel-sub"><a href="${esc(link)}" target="_blank" rel="noopener" title="Open on YouTube">${esc(c.handle || "YouTube")} ↗</a> · updated ${fmtWhen(c.last_update)}</div>
                <div class="channel-status">${status}</div>
              </div>
              <div>
                <div class="coverage-label"><span>${covered ? `${fmtDate(c.covered_from)} – ${c.covered_to === today ? "today" : fmtDate(c.covered_to)}` : "Nothing yet"}</span><span><a href="${CHANNEL_PAGE}?id=${encodeURIComponent(c.id)}">${plural(c.videos, "video")}</a>${c.bytes ? ` · ${fmtBytes(c.bytes)}` : ""}</span></div>
                <div class="coverage" title="Dates downloaded so far">${covered ? `<div class="coverage-fill" style="left:${left}%;width:${width}%"></div>` : ""}</div>
                <div class="coverage-scale"><span>${span === 180 ? "6 months ago" : fmtDate(oldest)}</span><span>today</span></div>
              </div>
              <div class="channel-actions">
                <button class="btn btn-small" data-act="update" ${running || waiting ? "disabled" : ""} title="Fetch what's new since the last update">Update now</button>
                <button class="btn btn-small" data-act="back">Fetch further back</button>
                <button class="btn btn-small btn-danger" data-act="remove" ${running ? "disabled" : ""}>Remove</button>
              </div>
              ${running ? jobHtml(job) : waiting ? `<div class="job"><div class="progress waiting"></div><div class="job-text">Waiting for another fetch to finish…</div></div>` : ""}
              ${c.last_error && !running && !waiting ? `<div class="job job-error">${esc(c.last_error)}</div>` : ""}
            </div>`;
        }).join("");

        // a new channel being looked up, before it has a row of its own
        const pending = [job, ...queued].filter((j) => j && j.kind === "fetch" && !j.channel);
        box.insertAdjacentHTML("beforeend", pending.map((j) => `
          <div class="panel channel">
            <div><div class="channel-name">${esc(j.label)}</div><div class="channel-sub">new channel</div></div>
            <div></div><div></div>
            ${j === job ? jobHtml(j) : `<div class="job"><div class="progress waiting"></div><div class="job-text">Waiting for another fetch to finish…</div></div>`}
          </div>`).join(""));
      }

      // nightly run, and anything running that isn't one channel's fetch
      const n = state.nightly;
      let nightly = n
        ? `Nightly update: <b class="${n.errors.length ? "bad" : ""}">${fmtWhen(n.at)}</b> · ${plural(n.added, "new video")}${n.pending ? ` · ${n.pending} waiting for captions` : ""}${n.errors.length ? ` · <span title="${esc(n.errors.join("\n"))}">${plural(n.errors.length, "problem")}</span>` : ""}`
        : `Nightly update at ${state.nightly_at}: hasn't run yet`;
      if (job && !job.channel && job.kind !== "fetch") nightly = `<b>${esc(job.label)}…</b>${job.current ? ` ${esc(job.current)}` : ""}`;
      $("#nightly").innerHTML = nightly;

      const st = state.storage;
      $("#storage").innerHTML = st
        ? `Transcripts use <b>${fmtBytes(st.db_bytes)}</b> · ${fmtBytes(st.free_bytes)} free on disk`
        : "";

      const selected = $("#f-channel").value;
      $("#f-channel").innerHTML = `<option value="">All channels</option>` +
        channels.map((c) => `<option value="${esc(c.id)}"${c.id === selected ? " selected" : ""}>${esc(c.name)}</option>`).join("");
      $("#known-channels").innerHTML = channels.filter((c) => c.handle).map((c) => `<option value="${esc(c.handle)}">`).join("");

      const err = state.last_add_error;
      if (err && Date.now() - new Date(err.at) < 10 * 60000 && !$("#add-url").value) {
        $("#add-note").className = "add-note error";
        $("#add-note").textContent = `Couldn't add ${err.label}: ${err.error}`;
      }
    }

    function jobHtml(job) {
      const parts = [job.checked ? `${plural(job.checked, "new video")} checked` : "Looking for new videos", job.added ? `${job.added} added` : ""].filter(Boolean);
      return `
        <div class="job">
          <div class="progress"></div>
          <div class="job-text">${job.waiting ? `<span class="job-wait">${esc(job.waiting)}</span> · ` : ""}${parts.join(" · ")}${job.current ? ` · now: ${esc(job.current)}` : ""}</div>
        </div>`;
    }

    async function loadChannels() {
      clearTimeout(pollTimer);
      try {
        state = await api("/channels");
        renderChannels();
      } catch (e) {
        $("#channels").innerHTML = `<div class="panel empty">Couldn't load the channels: ${esc(e.message)}</div>`;
      }
      // quick refresh while something is fetching, slow otherwise
      const busy = state && (state.job || state.queued.length);
      pollTimer = setTimeout(loadChannels, busy ? 2000 : 60000);
    }

    function accept(newState) {
      state = newState;
      renderChannels();
      clearTimeout(pollTimer);
      pollTimer = setTimeout(loadChannels, 2000);
    }

    $("#channels").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const c = state.channels.find((x) => x.id === btn.closest(".channel").dataset.id);
      try {
        if (btn.dataset.act === "update") {
          btn.disabled = true;
          accept(await api(`/channels/${c.id}/update`, { method: "POST" }));
        }
        if (btn.dataset.act === "back") {
          $("#add-url").value = c.handle || `https://www.youtube.com/channel/${c.id}`;
          // suggest one month more than we already have
          const have = c.covered_from ? dayDiff(state.today, c.covered_from) : 0;
          $("#add-n").value = Math.floor(have / 30) + 1;
          $("#add-unit").value = "months";
          updateNote();
          $("#add-form").scrollIntoView({ behavior: "smooth", block: "center" });
          $("#add-url").focus({ preventScroll: true });
        }
        if (btn.dataset.act === "remove" && confirm(`Remove ${c.name} and its ${plural(c.videos, "transcript")}?`)) {
          accept(await api(`/channels/${c.id}`, { method: "DELETE" }));
          search();
        }
      } catch (err) {
        alert(err.message);
        loadChannels();
      }
    });

    // "Last N days / weeks / months" -> days back from today (months are calendar months).
    function backDays() {
      const n = Math.max(1, Math.min(120, Math.round(+$("#add-n").value) || 1));
      const unit = $("#add-unit").value;
      if (unit === "days") return n;
      if (unit === "weeks") return n * 7;
      const today = new Date(), then = new Date(today);
      then.setMonth(then.getMonth() - n);
      return Math.round((today - then) / 86400000);
    }

    // Say up front what a fetch will actually download.
    function updateNote() {
      const note = $("#add-note");
      note.className = "add-note";
      if (!state) return (note.textContent = ADD_NOTE);
      const text = $("#add-url").value.trim().toLowerCase();
      const days = backDays();
      const c = state.channels.find((x) => (x.handle && [x.handle.toLowerCase(), x.handle.slice(1).toLowerCase()].some((h) => text === h || text.endsWith("/" + h) || text.includes("/" + h + "/"))) || text.includes(x.id.toLowerCase()));
      const cutoff = new Date(parseDay(state.today) - days * 86400000).toISOString().slice(0, 10);
      if (c && c.covered_from) {
        const to = c.covered_to === state.today ? "today" : fmtDate(c.covered_to);
        const since = c.covered_to === state.today ? "" : `${fmtDate(c.covered_to)} – today`;
        if (cutoff >= c.covered_from) {
          note.innerHTML = `<b>Already have ${esc(c.name)} back to ${fmtDate(c.covered_from)}.</b> ${since ? `Will fetch only ${since}.` : "Only brand-new videos will be fetched."}`;
        } else {
          note.innerHTML = `<b>Already have ${fmtDate(c.covered_from)} – ${to}.</b> Will fetch only ${fmtDate(cutoff)} – ${fmtDate(c.covered_from)}${since ? ` and ${since}` : ""}.`;
        }
      } else if (text) {
        note.textContent = `New channel: fetches back to ${fmtDate(cutoff)}. ${ADD_NOTE} A big first fetch can take an hour; it runs in the background, so you can leave this page.`;
      } else {
        note.textContent = ADD_NOTE;
      }
    }
    $("#add-url").addEventListener("input", updateNote);
    $("#add-n").addEventListener("input", updateNote);
    $("#add-unit").addEventListener("change", updateNote);

    $("#add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const channel = $("#add-url").value.trim();
      if (!channel) return $("#add-url").focus();
      const button = e.submitter || $("#add-form button");
      button.disabled = true;
      try {
        accept(await api("/fetch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ channel, days: backDays() }) }));
        $("#add-url").value = "";
        updateNote();
        $("#channels").lastElementChild?.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (err) {
        $("#add-note").className = "add-note error";
        $("#add-note").textContent = err.message;
      } finally {
        button.disabled = false;
      }
    });

    // ----- start: restore a search from the address bar (so results can be bookmarked or shared) -----
    const start = new URLSearchParams(location.search);
    $("#q").value = start.get("q") || "";
    if (start.get("mode") === "phrase") document.querySelector('.seg [data-mode="phrase"]').click();
    $("#f-days").value = start.get("days") || "";
    $("#f-sort").value = start.get("sort") || "new";
    updateNote();
    loadChannels().then(() => {
      if (start.get("channel")) $("#f-channel").value = start.get("channel");
      if ($("#q").value) search();
    });
  </script>
</body>
</html>
